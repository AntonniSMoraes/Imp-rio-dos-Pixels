    <script>
state=initial('central','Aurora','Valen');upgradeKingdom();speed=0;
const founder=byId(state.king);founder.age=30;founder.level=5;
const mate=makePerson({age:25,sex:founder.sex==='M'?'F':'M'});mate.level=5;state.people.push(mate);ensurePerson(mate);unite(founder,mate);
const mother=founder.sex==='F'?founder:mate,father=founder.sex==='M'?founder:mate;
mother.reproduction={version:1,pregnancy:{fatherId:father.id,babies:1,recoveryDays:24},nextAttemptDay:1,recoveryUntil:0};deliverPregnancy(mother);
const child=state.people.at(-1);child.age=25;child.level=5;founder.heir=child.id;succession(founder);death(founder,'de velhice');
const target=state.warfare.realms[0].tiles[0];Warfare.conquer(target,'crown',child);Warfare.conquer(target,state.warfare.realms[0].id);
validateSave(JSON.parse(JSON.stringify(state)));isMandatoryModal=false;document.querySelector('#modal').close();view='dynasty';render();
